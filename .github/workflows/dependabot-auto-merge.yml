name: Dependabot auto-merge

# Private repo on the free plan: branch rulesets and GitHub auto-merge are not available, so
# `gh pr merge --auto` would merge at once. Instead, merge a Dependabot PR only after the CI
# workflow (every job) has finished green for that PR's exact head commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the green Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,author \
            -q '.[] | select(.author.login == "app/dependabot") | .number')
          [ -n "$pr" ] || { echo "No open Dependabot PR for $BRANCH"; exit 0; }
          # --match-head-commit refuses the merge if the PR moved on since CI passed.
          gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$SHA"
