name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build
