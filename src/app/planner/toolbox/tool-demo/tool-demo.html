@switch (tool()) {
  @case ('select') {
    <div class="sofa"><span class="ring"></span></div>
    <div class="chair"><span class="ring"></span></div>
    <div class="marquee window"></div>
    <div class="marquee crossing"></div>
    <svg class="pointer select-pointer" viewBox="0 0 16 16">
      <path
        d="M1 1 L1 14 L4.4 10.4 L8 16 L10.1 14.9 L6.5 9.3 L11.2 8.8 Z"
        fill="#fff"
        stroke="#111"
        stroke-width="0.8"
        stroke-linejoin="round"
      />
    </svg>
  }
  @case ('pan') {
    <div class="world">
      <div class="sofa"></div>
      <div class="chair"></div>
      <svg class="pointer" viewBox="0 0 16 16">
        <path
          d="M1 1 L1 14 L4.4 10.4 L8 16 L10.1 14.9 L6.5 9.3 L11.2 8.8 Z"
          fill="#fff"
          stroke="#111"
          stroke-width="0.8"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  }
  @case ('measure') {
    <div class="segment"></div>
    <div class="dot measure-start"></div>
    <div class="dot measure-end"></div>
    <div class="dimension">
      <span class="tick left"></span>
      <span class="tick right"></span>
      <div class="dim-line"></div>
      <span class="chip dim-chip">2.40 m</span>
    </div>
  }
  @case ('wall') {
    <svg class="demo-svg" viewBox="0 0 100 50">
      <polyline class="dw-edge" points="14,16 60,16 60,38" />
      <polyline class="dw-core" points="14,16 60,16 60,38" />
      <circle class="dw-dot" cx="14" cy="16" r="2.6" />
      <circle class="dw-dot" cx="60" cy="16" r="2.6" />
      <circle class="dw-dot" cx="60" cy="38" r="2.6" />
    </svg>
  }
  @case ('door') {
    <svg class="demo-svg" viewBox="0 0 100 50">
      <line class="dw-edge" x1="8" y1="15" x2="30" y2="15" />
      <line class="dw-edge" x1="56" y1="15" x2="92" y2="15" />
      <line class="dw-core" x1="8" y1="15" x2="30" y2="15" />
      <line class="dw-core" x1="56" y1="15" x2="92" y2="15" />
      <line class="dw-line" x1="30" y1="15" x2="56" y2="15" />
      <line class="dw-line" x1="30" y1="15" x2="30" y2="41" />
      <path class="dw-line" d="M 30 41 A 26 26 0 0 1 56 15" />
      <circle class="dw-dot" cx="30" cy="15" r="2.6" />
    </svg>
  }
  @case ('window') {
    <svg class="demo-svg" viewBox="0 0 100 50">
      <line class="dw-edge" x1="8" y1="25" x2="32" y2="25" />
      <line class="dw-edge" x1="68" y1="25" x2="92" y2="25" />
      <line class="dw-core" x1="8" y1="25" x2="32" y2="25" />
      <line class="dw-core" x1="68" y1="25" x2="92" y2="25" />
      <rect class="dw-fill" x="32" y="19" width="36" height="12" />
      <line class="dw-line" x1="32" y1="25" x2="68" y2="25" />
    </svg>
  }
  @case ('rect') {
    <div class="shape rect"></div>
    <div class="crosshair"><span></span><span></span></div>
  }
  @case ('circle') {
    <div class="shape circle"></div>
    <div class="crosshair"><span></span><span></span></div>
  }
  @case ('ellipse') {
    <div class="shape ellipse"></div>
    <div class="crosshair"><span></span><span></span></div>
  }
}
