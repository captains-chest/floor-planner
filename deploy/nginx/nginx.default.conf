server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    include /etc/nginx/security-headers.conf;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|gif|webp|map)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
